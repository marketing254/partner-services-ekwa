// ── Form submission ────────────────────────────────────────────────────────
// Submissions POST to a Google Apps Script Web App, which writes a row to the
// Google Sheet and emails the team. Paste your deployed /exec URL below.
const SHEET_ENDPOINT='https://script.google.com/macros/s/AKfycbyL9vL7_QotT96CEMOduJ9YaU1EIPUSD-AWPsLoefXsjyD0wDkhwghT157diR2IZ57y/exec';

// Posts the form to the Sheet. Uses text/plain so the browser treats it as a
// "simple" request (no CORS preflight, which Apps Script can't answer).
const submitToSheet=(formType,payload)=>fetch(SHEET_ENDPOINT,{
  method:'POST',
  headers:{'Content-Type':'text/plain;charset=utf-8'},
  body:JSON.stringify({formType,...payload}),
});

// Fallback: open the visitor's email client if the endpoint isn't set or fails.
const buildMailto=(to,subject,fields)=>{
  const body=Object.entries(fields).filter(([_,v])=>v!==''&&v!==false&&!(Array.isArray(v)&&v.length===0)).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join(', '):v}`).join('\n');
  return `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
};

const Navbar=()=>{
  const [scrolled,setScrolled]=useState(false);
  useEffect(()=>{
    let ticking=false;
    const onS=()=>{
      if(!ticking){
        window.requestAnimationFrame(()=>{
          setScrolled(window.scrollY>12);
          ticking=false;
        });
        ticking=true;
      }
    };
    window.addEventListener('scroll',onS,{passive:true});
    return ()=>window.removeEventListener('scroll',onS);
  },[]);
  return (<header className={`sticky top-0 z-50 transition-colors duration-200 border-b ${scrolled?'bg-white border-ekwa-line shadow-sm':'bg-white border-transparent'}`}>

const EventsWaitlistForm=()=>{

  const [error,setError]=useState('');
  const onChange=(e)=>{const {name,value,type,checked}=e.target;setData({...data,[name]:type==='checkbox'?checked:value});};
  const onSubmit=async(e)=>{
    e.preventDefault();
    setSubmitting(true);setError('');
    try{
      await submitToSheet('waitlist',data);
      setSubmitted(true);
    }catch(err){
      setError("We couldn't reach the server. Email us at partnerservices@ekwa.com and we'll add you.");

      setSubmitting(false);
    }
  };
  if(submitted) return (<div className="bg-white rounded-2xl border border-ekwa-line shadow-card p-8 md:p-10 text-center"><div className="w-14 h-14 mx-auto mb-5 rounded-full bg-ekwa-orange/10 flex items-center justify-center"><Check className="w-7 h-7 text-ekwa-orange" stroke="2.5"/></div><h3 className="font-serif font-semibold text-[1.5rem] text-ekwa-ink mb-3">You're on the list.</h3><p className="text-ekwa-ink/65 text-[0.96rem] leading-relaxed">Thanks — we've got your details and we'll be in touch when Events intake opens late 2026. Questions in the meantime? Reach us at <a className="text-ekwa-orange underline" href="mailto:partnerservices@ekwa.com">partnerservices@ekwa.com</a>.</p></div>);
  return (<form onSubmit={onSubmit} className="bg-white rounded-2xl border border-ekwa-line shadow-card p-7 md:p-8 space-y-4">
